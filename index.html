<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit measurements and contact details in one simple request.">
    <title>Measure &amp; Send</title>
    <link rel="stylesheet" href="./css/styles.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="brand" aria-label="Measure and Send">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span>Measure &amp; Send</span>
        <span class="prototype-badge">Request form</span>
      </header>

      <section class="form-layout" aria-labelledby="page-title">
        <div class="intro">
          <p class="eyebrow">MEASUREMENT FORM</p>
          <h1 id="page-title">A few details,<br><span>one clear request.</span></h1>
          <p>Enter your measurements, review them, and leave your contact details.</p>
        </div>

        <div class="form-column">
          <nav class="progress" aria-label="Form progress">
            <p class="progress-mobile" id="progress-mobile">Step 1 of 5</p>
            <ol class="progress-list" id="progress-list"></ol>
          </nav>

          <div id="app" aria-live="polite"></div>
          <noscript>This form requires JavaScript to work.</noscript>
        </div>
      </section>
    </main>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
